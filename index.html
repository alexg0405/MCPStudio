<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>AGstudio</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- A plain dark page while the app loads (no texture until the app is up). -->
    <style>
      html,
      body {
        background: var(--boot-bg, #0b0c0e);
      }
    </style>
    <script>
      // The saved theme is on the page before anything paints: no flash of the default dark stone before a
      // light or slate theme (the stylesheet keys its colors off data-theme; the app re-applies it when it starts).
      try {
        var theme = JSON.parse(localStorage.getItem('agstudio:prefs:v1') || '{}').theme;
        var boot = { carrara: '#e9e6e0', light: '#e6e9ec', classic: '#1b2024', midnight: '#0f1215', graphite: '#1e1e1e' };
        if (boot[theme]) {
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.setProperty('--boot-bg', boot[theme]);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/ui/main.tsx"></script>
  </body>
</html>
